tagline: "Understanding how lakes respond to a changing world, with *physics* and *machine learning*."
bio: >-
  I work in AI for Science, studying freshwater lakes at the intersection of AI and hydrology.
  As a postdoctoral fellow with Dr. Jianguo (Jack) Liu at Michigan State
  University and the University of Michigan, I trace the metacoupled, multi-shock drivers of
  Lake Erie's harmful algal bloom extremes. My work combines physics-guided machine learning
  with process-based models and long-term observations to understand and forecast how lakes change.

