<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% include theme-init.html %}
<title>{% if page.url == "/" %}{{ site.title }} · {{ site.data.profile.role }}{% else %}{{ page.title | escape }} · {{ site.title }}{% endif %}</title>
{% seo title=false %}
<meta name="theme-color" content="#FBFAF7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1517" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/svg+xml" href="{{ '/images/favicon.svg' | relative_url }}">
<link rel="icon" type="image/png" sizes="32x32" href="{{ '/images/favicon-32.png' | relative_url }}">
<link rel="apple-touch-icon" href="{{ '/images/apple-touch-icon.png' | relative_url }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"></noscript>
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
{% if page.url == "/" %}{% assign p = site.data.profile %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": {{ p.name | jsonify }},
  "jobTitle": {{ p.role | jsonify }},
  "affiliation": [
    { "@type": "CollegeOrUniversity", "name": "Michigan State University" },
    { "@type": "CollegeOrUniversity", "name": "University of Michigan" }
  ],
  "url": {{ site.url | append: "/" | jsonify }},
  "image": {{ "/assets/img/profile-800.webp" | absolute_url | jsonify }},
  "sameAs": {{ p.links | map: "url" | jsonify }}
}
</script>
{% endif %}
