{% assign p = site.data.profile %}
<header class="nav" id="nav">
  <div class="container nav-inner">
    <a class="wordmark" href="{{ '/' | relative_url }}">{{ p.name }}</a>
    <nav aria-label="Main">
      <ul class="nav-links">
        {% for item in site.data.nav %}
        <li><a class="nav-link{% if page.url contains item.url %} active{% endif %}" href="{{ item.url | relative_url }}"{% if page.url contains item.url %} aria-current="page"{% endif %}>{{ item.label | escape }}</a></li>
        {% endfor %}
        <li class="nav-theme"><button class="icon-btn theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">{% include icons/moon.svg %}{% include icons/sun.svg %}</button></li>
      </ul>
      <button class="icon-btn menu-btn" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="mobile-menu">{% include icons/menu.svg %}</button>
    </nav>
  </div>
</header>
<div class="mobile-menu" id="mobile-menu" role="dialog" aria-modal="true" aria-label="Site menu" hidden>
  <div class="mm-top">
    <a class="wordmark" href="{{ '/' | relative_url }}">{{ p.name }}</a>
    <button class="icon-btn menu-close" type="button" aria-label="Close menu">{% include icons/close.svg %}</button>
  </div>
  <ul class="mm-links">
    <li><a href="{{ '/' | relative_url }}"{% if page.url == "/" %} class="active" aria-current="page"{% endif %}>Home</a></li>
    {% for item in site.data.nav %}
    <li><a href="{{ item.url | relative_url }}"{% if page.url contains item.url %} class="active" aria-current="page"{% endif %}>{{ item.label | escape }}</a></li>
    {% endfor %}
  </ul>
  <div class="mm-bottom">
    <button class="icon-btn theme-toggle" type="button" aria-label="Toggle dark mode">{% include icons/moon.svg %}{% include icons/sun.svg %}</button>
  </div>
</div>
